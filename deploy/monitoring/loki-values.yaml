# Loki single-binary для stage (одна нода)
# Helm: grafana/loki

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  singleBinary:
    replicas: 1
  limits_config:
    retention_period: 168h
  chunk_store_config:
    max_look_back_period: 168h
  table_manager:
    retention_deletes_enabled: true
    retention_period: 168h

resources:
  limits:
    memory: 512Mi
  requests:
    memory: 256Mi
