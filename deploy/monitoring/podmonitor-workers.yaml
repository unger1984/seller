# PodMonitor для scrape метрик BullMQ с воркеров (порт 9090).
# Применить после kube-prometheus-stack: kubectl apply -f deploy/monitoring/podmonitor-workers.yaml -n seller-stage
# Prometheus Operator должен быть установлен (входит в kube-prometheus-stack).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: seller-workers
  namespace: seller-stage
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: seller-worker-import
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 15s
---
