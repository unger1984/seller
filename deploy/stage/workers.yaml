# ConfigMap: env для воркеров (не секреты)
apiVersion: v1
kind: ConfigMap
metadata:
  name: seller-workers-config
  namespace: seller-stage
  labels:
    app: seller-workers
data:
  REDIS_URL: 'redis://seller-redis:6379'
  SMTP_USE_LOCAL_POSTFIX: 'false'
  FRONTEND_URL: '${FRONTEND_URL:-https://localhost:8443}'
  SMTP_FROM: 'unger1984@gmail.com'
# Secrets — только пароли. Создать вручную.
# seller-worker-secret (для import/publish/sync-stock): DATABASE_URL
# seller-worker-email-secret (для worker-email): SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD
#   Gmail: создать App Password в https://myaccount.google.com/apppasswords
#   --from-literal=SMTP_HOST=smtp.gmail.com --from-literal=SMTP_PORT=587 \
#   --from-literal=SMTP_USER=email@gmail.com --from-literal=SMTP_PASSWORD='abcd efgh ijkl mnop'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seller-worker-import
  namespace: seller-stage
  labels:
    app: seller-worker-import
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seller-worker-import
  template:
    metadata:
      labels:
        app: seller-worker-import
    spec:
      containers:
        - name: worker
          image: 192.168.1.8:30500/seller/worker-import:latest
          imagePullPolicy: Always
          ports:
            - name: metrics
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: seller-workers-config
            - secretRef:
                name: seller-worker-secret
          resources:
            requests:
              memory: '128Mi'
              cpu: '100m'
            limits:
              memory: '256Mi'
              cpu: '500m'
---
