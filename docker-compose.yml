# Только для локальной разработки. Prod — secrets через K8s.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seller
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seller}
      POSTGRES_DB: seller
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  pgdata:
